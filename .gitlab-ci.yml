stages:
  - init
  - plan
  - apply

image: hashicorp/terraform:1.15.7

# Global environment variables for the Terraform Azure provider used in each job
variables:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: $AZURE_CLIENT_ID
  ARM_TENANT_ID: $AZURE_TENANT_ID
  ARM_SUBSCRIPTION_ID: $AZURE_SUBSCRIPTION_ID

tf_validate:
  image: hashicorp/terraform:1.15.7
  stage: init
  id_tokens:
    ARM_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  script:
    - terraform init
    - terraform fmt
    - terraform validate

tf_plan:
  stage: plan
  id_tokens:
    ARM_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  script:
    - terraform init
    - terraform plan
