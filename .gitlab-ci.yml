stages:
  - plan
  - apply

# GLobal rule to run on master branch only
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

# Global environment variables for the Terraform Azure provider used in each job
variables:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: $AZURE_CLIENT_ID
  ARM_TENANT_ID: $AZURE_TENANT_ID
  ARM_SUBSCRIPTION_ID: $AZURE_SUBSCRIPTION_ID

  TF_PLUGIN_CACHE_DIR: $CI_PROJECT_DIR/.terraform.d/plugin-cache

# Hidden job template for bootstrap Terraform jobs
.tf_bootstrap_rules:
  rules:
    - &bootstrap_rule #YAML anchor for bootstrap rules to allow for use with "when: manual" in the apply job
      if: $CI_COMMIT_BRANCH == "master"
      changes:
        - src/azure/bootstrap/**/*

#Hidden job template for dev Terraform jobs
.tf_dev_rules:
  rules:
    - &dev_rule #YAML anchor for dev rules to allow for use with "when: manual" in the apply job
      if: $CI_COMMIT_BRANCH == "master"
      changes:
        - src/azure/environments/dev/**/*
        - src/azure/modules/**/*

# Hidden job template for Terraform jobs
.tf_job:
  image:
    name: hashicorp/terraform:1.15.7
    entrypoint: [""]
  before_script:
    - mkdir -p $TF_PLUGIN_CACHE_DIR
    - cd $WORKING_DIR
  script: &tf_script
    - terraform init
    - terraform fmt -check -recursive
    - terraform validate
  id_tokens:
    ARM_OIDC_TOKEN:
      aud: api://AzureADTokenExchange

bootstrap_tf_plan:
  extends:
    - .tf_job
    - .tf_bootstrap_rules
  stage: plan
  variables:
    WORKING_DIR: "src/azure/bootstrap"
  cache:
    key:
      files:
        - src/azure/bootstrap/.terraform.lock.hcl
    paths:
      - .terraform.d/plugin-cache
  script:
    - *tf_script
    - terraform plan -out=tfplan
  artifacts:
    when: on_success
    expire_in: 1 days
    paths:
      - src/azure/bootstrap/tfplan

dev_tf_plan:
  extends:
    - .tf_job
    - .tf_dev_rules
  stage: plan
  variables:
    WORKING_DIR: src/azure/environments/dev
  cache:
    key:
      files:
        - src/azure/environments/dev/.terraform.lock.hcl
    paths:
      - .terraform.d/plugin-cache
  script:
    - *tf_script
    - terraform plan -var-file=dev.tfvars -out=tfplan
  artifacts:
    when: on_success
    expire_in: 1 days
    paths:
      - src/azure/environments/dev/tfplan

bootstrap_tf_apply:
  extends:
    - .tf_job
  stage: apply
  variables:
    WORKING_DIR: src/azure/bootstrap
  script:
    - terraform init
    - terraform apply -auto-approve tfplan
  needs:
    - job: bootstrap_tf_plan
      artifacts: true
  rules:
    - <<: *bootstrap_rule
      when: manual

dev_tf_apply:
  extends:
    - .tf_job
  stage: apply
  variables:
    WORKING_DIR: src/azure/environments/dev
  script:
    - terraform init
    - terraform apply -auto-approve tfplan
  needs:
    - job: dev_tf_plan
      artifacts: true
  rules:
    - <<: *dev_rule
      when: manual
