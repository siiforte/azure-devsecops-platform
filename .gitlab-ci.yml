stages:
  - plan
  - apply

# GLobal rule to run on master branch only
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

# Global environment variables for the Terraform Azure provider used in each job
variables:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: $AZURE_CLIENT_ID
  ARM_TENANT_ID: $AZURE_TENANT_ID
  ARM_SUBSCRIPTION_ID: $AZURE_SUBSCRIPTION_ID

  WORKING_DIR: ""

  TF_PLUGIN_CACHE_DIR: $CI_PROJECT_DIR/.terraform.d/plugin-cache

# Anchor job template for Terraform jobs
.tf_job: &tf_job
  image:
    name: hashicorp/terraform:1.15.7
    entrypoint: [""]
  before_script:
    - mkdir -p $TF_PLUGIN_CACHE_DIR
    - cd $WORKING_DIR
  id_tokens:
    ARM_OIDC_TOKEN:
      aud: api://AzureADTokenExchange

bootstrap_tf_plan:
  <<: *tf_job
  stage: plan
  variables:
    WORKING_DIR: "src/azure/bootstrap"
  cache:
    key:
      files:
        - src/azure/bootstrap/.terraform.lock.hcl
    paths:
      - .terraform.d/plugin-cache
  script:
    - terraform init
    - terraform fmt -check -recursive
    - terraform validate
    - terraform plan -out=tfplan
  artifacts:
    when: on_success
    expire_in: 1 days
    paths:
      - src/azure/bootstrap/tfplan
  when: manual

dev_tf_plan:
  <<: *tf_job
  stage: plan
  variables:
    WORKING_DIR: src/azure/environments/dev
  cache:
    key:
      files:
        - src/azure/environment/dev/.terraform.lock.hcl
    paths:
      - .terraform.d/plugin-cache
  script:
    - terraform init
    - terraform fmt -check -recursive
    - terraform validate
    - terraform plan -var-file=dev.tfvars -out=tfplan
  artifacts:
    when: on_success
    expire_in: 1 days
    paths:
      - src/azure/environment/dev/tfplan

bootstrap_tf_apply:
  <<: *tf_job
  stage: apply
  variables:
    WORKING_DIR: src/azure/bootstrap
  script:
    - terraform init
    - terraform apply -auto-approve tfplan
  needs:
    - job: bootstrap_tf_plan
      artifacts: true
  when: manual

dev_tf_apply:
  <<: *tf_job
  stage: apply
  variables:
    WORKING_DIR: src/azure/environments/dev
  script:
    - terraform init
    - terraform apply -auto-approve tfplan
  needs:
    - job: dev_tf_plan
      artifacts: true
  when: manual
