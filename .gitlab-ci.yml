stages:
  - .pre
  - validate
  - plan
  - apply

image: hashicorp/terraform:1.15.7

azurerm_oidc:
  stage: .pre
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  script:
    - az login --service-principal -u $ARM_CLIENT_ID -t $ARM_TENANT_ID -s $ARM_SUBSCRIPTION_ID --federated-token $GITLAB_OIDC_TOKEN
    - az account show

tf_validate:
  stage: validate
  script:
    - terraform init
    - terraform fmt
    - terraform validate
    - export $ARM_SUBSCRIPTION_ID=TF_VAR_azure_subscription_id

tf_plan:
  stage: plan
  script:
    - terraform plan
