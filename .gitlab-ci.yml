stages:
  - init
  - plan
  - apply

# GLobal rule to run on master branch only
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

image:
  name: hashicorp/terraform:1.15.7
  entrypoint: [""]

# Global environment variables for the Terraform Azure provider used in each job
variables:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: $AZURE_CLIENT_ID
  ARM_TENANT_ID: $AZURE_TENANT_ID
  ARM_SUBSCRIPTION_ID: $AZURE_SUBSCRIPTION_ID

  WORKING_DIR: "src/azure/bootstrap"

  TF_PLUGIN_CACHE_DIR: $CI_PROJECT_DIR/.terraform-plugin-cache

cache:
  key:
    files:
      - $WORKING_DIR/.terraform.lock.hcl
  paths:
    - $TF_PLUGIN_CACHE_DIR

before_script:
  - mkdir -p $TF_PLUGIN_CACHE_DIR
  - cd $WORKING_DIR

tf_plan:
  stage: plan
  id_tokens:
    ARM_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  script:
    - terraform init
    - terraform fmt -check -recursive
    - terraform validate
    - terraform plan -out=tfplan.tf
  artifacts:
    when: on_success
    expire_in: 1 days
    paths:
      - $WORKING_DIR/tfplan.tf

tf_apply:
  stage: apply
  id_tokens:
    ARM_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  script:
    - terraform apply -auto-approve $WORKING_DIR/tfplan.tf
