stages:
  - init
  - plan
  - apply

# GLobal rule to run on master branch only
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

image:
  name: hashicorp/terraform:1.15.7
  entrypoint: [""]

# Global environment variables for the Terraform Azure provider used in each job
variables:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: $AZURE_CLIENT_ID
  ARM_TENANT_ID: $AZURE_TENANT_ID
  ARM_SUBSCRIPTION_ID: $AZURE_SUBSCRIPTION_ID

tf_plan:
  stage: plan
  id_tokens:
    ARM_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  script:
    - cd src/azure/bootstrap
    - terraform init
    - terraform fmt -check -recursive
    - terraform validate
    - terraform plan -out=tfplan.tf
  artifacts:
    when: on_success
    expire_in: 2 days
    paths:
      - src/azure/bootstrap/tfplan.tf

tf_apply:
  stage: apply
  id_tokens:
    ARM_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  script:
    - cd src/azure/bootstrap
    - terraform apply -auto-approve tfplan.tf
