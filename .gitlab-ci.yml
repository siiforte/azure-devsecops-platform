stages:
  - plan
  - apply

# GLobal rule to run on master branch only
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

image:
  name: hashicorp/terraform:1.15.7
  entrypoint: [""]

# Global environment variables for the Terraform Azure provider used in each job
variables:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: $AZURE_CLIENT_ID
  ARM_TENANT_ID: $AZURE_TENANT_ID
  ARM_SUBSCRIPTION_ID: $AZURE_SUBSCRIPTION_ID

  WORKING_DIR: "src/azure/bootstrap"

  TF_PLUGIN_CACHE_DIR: $CI_PROJECT_DIR/.terraform.d/plugin-cache

before_script:
  - cd $WORKING_DIR

tf_plan:
  stage: plan
  id_tokens:
    ARM_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  cache:
    key:
      files:
        - src/azure/bootstrap/.terraform.lock.hcl
    paths:
      - .terraform.d/plugin-cache
  script:
    - mkdir -p $TF_PLUGIN_CACHE_DIR
    - terraform init
    - terraform fmt -check -recursive
    - terraform validate
    - terraform plan -out=tfplan
  artifacts:
    when: on_success
    expire_in: 1 days
    paths:
      - src/azure/bootstrap/tfplan

tf_apply:
  stage: apply
  id_tokens:
    ARM_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  script:
    - terraform init
    - terraform apply -auto-approve tfplan
  needs:
    - job: tf_plan
      artifacts: true
  when: manual
